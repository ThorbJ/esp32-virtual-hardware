<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Virtual device (dev)</title>
  <script type="importmap">
    { "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
  </script>
  <style>
    body { margin: 0; font: 14px system-ui, sans-serif; display: grid; grid-template-columns: 1fr 360px; height: 100vh; background: #eef0f3; color: #181818; }
    #stage { position: relative; min-height: 0; min-width: 0; overflow: hidden; }
    #stage canvas { display: block; width: 100%; height: 100%; }
    aside { padding: 12px 16px; overflow: auto; background: #fff; border-left: 1px solid #ddd; }
    pre { white-space: pre-wrap; font-size: 12px; max-height: 30vh; overflow: auto; background: #f6f6f6; padding: 6px; }
    dt { color: #666; } dd { margin: 0 0 6px; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <aside>
    <dl>
      <dt>phase</dt><dd data-f="phase">—</dd>
      <dt>progress</dt><dd data-f="progress">—</dd>
      <dt>power / boots</dt><dd data-f="power">—</dd>
      <dt>computer link</dt><dd data-f="link">—</dd>
      <dt>firmware</dt><dd data-f="firmware">—</dd>
    </dl>
    <p><button id="repower" type="button">Power cycle</button>
      <label><input type="checkbox" id="mic"> mic</label> <label><input type="checkbox" id="camera"> camera</label></p>
    <details open><summary>device log</summary><pre id="log"></pre></details>
    <details><summary>traffic</summary><pre id="traffic"></pre></details>
  </aside>
  <script type="module" src="./main.mjs"></script>
</body>
</html>
